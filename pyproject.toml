[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-quant"
version = "0.1.0"
description = "Modular crypto quantitative research and trading system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Quantitative Research Team"}
]
keywords = ["crypto", "quant", "trading", "research", "backtest"]

dependencies = [
    "pandas>=2.0.0",
    "polars>=0.19.0",
    "numpy>=1.24.0",
    "pyarrow>=13.0.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "requests>=2.31.0",
    "websockets>=11.0",
    "pytest>=7.4.0",
    "python-dotenv>=1.0.0",
    "seaborn>=0.12.0",
    "ta-lib>=0.4.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.287",
    "mypy>=1.5.0",
    "jupyter>=1.0.0",
    "ipython>=8.14.0",
]

[tool.setuptools]
packages = ["crypto_quant"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
