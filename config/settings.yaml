project:
  name: "crypto-quant"
  version: "0.1.0"
  description: "Modular crypto quantitative research system"

exchange:
  name: "binance"
  market: "usdm_futures"
  symbol: "BTCUSDT"
  interval: "1m"
  testnet: false

data:
  raw_dir: "./data/raw"
  processed_dir: "./data/processed"
  features_dir: "./data/features"
  
  # Historical data date range
  start_date: "2022-01-01"
  end_date: "2026-08-31"
  
  # Data sources to collect
  sources:
    - klines
    - funding_rate
    - open_interest

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  dir: "./logs"

research:
  random_seed: 42
  
  # Train/validation/test split
  train_end: "2024-12-31"
  validation_end: "2025-12-31"
  test_end: "2026-08-31"
